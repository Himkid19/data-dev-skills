name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  verify:
    name: lint + adapter guard + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install -q pytest

      - name: Marketplace consistency
        run: python scripts/lint_marketplace.py --check

      - name: Adapter copies in sync
        run: python scripts/sync_adapters.py --check

      - name: Tests
        run: python -m pytest tests/ -q

  package:
    name: package WorkBuddy ZIPs
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build ZIPs
        run: python scripts/package_zips.py --out dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: workbuddy-skills-${{ github.ref_name }}
          path: dist/*.zip
          retention-days: 30
